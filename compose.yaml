services:
  db:
    image: postgres:17-alpine
    container_name: planqora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: planqora
      POSTGRES_PASSWORD: planqora
      POSTGRES_DB: planqora
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
